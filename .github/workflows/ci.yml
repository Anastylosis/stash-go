name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: Anastylosis/.github/.github/workflows/go-ci.yml@v1
    permissions:
      contents: read
      checks: write
      # Required even with codecov: false. The shared workflow's test job
      # declares id-token: write for Codecov's OIDC auth, and a reusable
      # workflow cannot request more than its caller grants — without this the
      # run fails at startup, before a single step executes.
      id-token: write
    secrets: inherit
    with:
      binary-name: stash-go
      main-package: .
      # Every test drives an httptest stub, so the suite has to pass with no
      # outbound network. Anything reaching a real Stash would be a bug.
      offline-isolation: true
      platform-tests: true
      # integration_test.go is behind //go:build integration, so nothing in CI
      # compiles it today. Static only: `go vet -tags=integration` type-checks
      # the file without executing it, so no live Stash is contacted.
      vet-integration-tag: true
