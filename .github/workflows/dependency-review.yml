name: Dependency review

# Flags a pull request that introduces a dependency with a known advisory, or
# one whose licence does not fit, before it is merged rather than after
# Dependabot notices it on master.
#
# This does nothing today: the maintainer pushes straight to master, and the
# action only runs on pull_request. That is deliberate — it is here so the
# first outside contribution is reviewed properly on arrival, not so a workflow
# can be written in a hurry once one shows up.

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    uses: Anastylosis/.github/.github/workflows/dependency-review.yml@v1
    permissions:
      contents: read
      # Required by comment-summary-in-pr; without it the action cannot post
      # and the step fails for a reason unrelated to the dependencies.
      pull-requests: write
    with:
      # Block on high and above. This module has no dependencies at all --
      # standard library only, which is a stated property of the library --
      # so anything this fires on is a PR proposing the first one, and that
      # deserves a look regardless.
      fail-on-severity: high
